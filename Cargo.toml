[workspace]
members = ["appopt"]
exclude = ["appopt-ebpf"]
resolver = "3"

[workspace.package]
version = "2.2.3"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.88"

[workspace.dependencies]
aya = "0.14.0"
libc = "0.2"
signal-hook = "0.4"
tikv-jemallocator = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = false